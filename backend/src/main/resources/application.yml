spring:
  application:
    name: dental-clinic-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental_clinic}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway is the only schema owner. Set FLYWAY_ENABLED=false only for
  # explicit diagnostics where migrations must not run.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true

  jackson:
    time-zone: ${CLINIC_TIMEZONE:Asia/Ho_Chi_Minh}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

clinic:
  timezone: ${CLINIC_TIMEZONE:Asia/Ho_Chi_Minh}
  appointment:
    slot-duration-minutes: ${SLOT_DURATION_MINUTES:60}
    booking-min-advance-minutes: ${BOOKING_MIN_ADVANCE_MINUTES:120}
    cancellation-cutoff-minutes: ${CANCELLATION_CUTOFF_MINUTES:90}
    reschedule-cutoff-minutes: ${RESCHEDULE_CUTOFF_MINUTES:90}
    no-show-grace-minutes: ${NO_SHOW_GRACE_MINUTES:15}
    delay-warning-minutes: ${DELAY_WARNING_MINUTES:30}

security:
  jwt:
    # Required Base64-encoded secret containing at least 256 bits.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:dental-clinic-backend}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  session:
    admin:
      absolute-lifetime: ${ADMIN_SESSION_ABSOLUTE_LIFETIME:8h}
      idle-timeout: ${ADMIN_SESSION_IDLE_TIMEOUT:15m}
    doctor:
      absolute-lifetime: ${DOCTOR_SESSION_ABSOLUTE_LIFETIME:12h}
      idle-timeout: ${DOCTOR_SESSION_IDLE_TIMEOUT:20m}
    staff:
      absolute-lifetime: ${STAFF_SESSION_ABSOLUTE_LIFETIME:12h}
      idle-timeout: ${STAFF_SESSION_IDLE_TIMEOUT:20m}
    patient:
      absolute-lifetime: ${PATIENT_SESSION_ABSOLUTE_LIFETIME:7d}
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    domain: ${AUTH_COOKIE_DOMAIN:}

logging:
  level:
    root: INFO
    com.dentalclinic: ${APP_LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  paths-to-match: /api/**
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
