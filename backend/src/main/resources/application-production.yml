spring:
  config:
    activate:
      on-profile: production

  jpa:
    hibernate:
      ddl-auto: validate

  # Flyway remains the only schema owner in production.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# API documentation is opt-in in production.
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
