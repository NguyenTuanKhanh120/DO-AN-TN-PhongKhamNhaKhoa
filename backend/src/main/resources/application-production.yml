spring:
  config:
    activate:
      on-profile: production

  jpa:
    hibernate:
      ddl-auto: validate

  # Flyway remains the only schema owner in production.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

security:
  auth-cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    domain: ${AUTH_COOKIE_DOMAIN:}

# API documentation is opt-in in production.
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}
